name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        required: true
        default: 'IndusApp'
      pkgName:
        description: 'Package Name'
        required: true
        default: 'com.indus.app'
      htmlContentBase64:
        description: 'Base64 Encoded HTML File'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup & Build Android APK
        run: |
          # Sanitize Package Name
          RAW_PKG="${{ github.event.inputs.pkgName }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._')
          if [[ "$CLEAN_PKG" != *.* ]]; then
            CLEAN_PKG="com.indus.${CLEAN_PKG}"
          fi

          # 1. Install Capacitor Packages
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # 2. Write Config File directly (bypasses all interactive prompt freezes)
          cat <<EOF > capacitor.config.json
          {
            "appId": "$CLEAN_PKG",
            "appName": "${{ github.event.inputs.appName }}",
            "webDir": "www"
          }
          EOF

          # 3. Create Web directory & Inject Code
          mkdir -p www
          echo "${{ github.event.inputs.htmlContentBase64 }}" | base64 --decode > www/index.html

          # 4. Generate Native Android Project
          npx cap add android

          # 5. Compile APK without background daemon
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
