name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        required: true
        default: 'IndusApp'
      pkgName:
        description: 'Package Name'
        required: true
        default: 'com.indus.app'
      htmlContentBase64:
        description: 'Base64 Encoded HTML File'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Accept All Licenses
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Capacitor & Safely Inject Code
        run: |
          # 1. Clean package name
          RAW_PKG="${{ github.event.inputs.pkgName }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._')
          if [[ "$CLEAN_PKG" != *.* ]]; then
            CLEAN_PKG="com.indus.${CLEAN_PKG}"
          fi

          # 2. Init Node project
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # 3. Create folder
          mkdir -p www

          # 4. Safely inject Config & HTML using Node.js (Handles all spaces, quotes & special characters)
          node -e '
          const fs = require("fs");
          const appId = process.argv[1];
          const appName = process.argv[2];
          const b64 = process.argv[3];
          
          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: appId,
            appName: appName,
            webDir: "www"
          }, null, 2));

          fs.writeFileSync("www/index.html", Buffer.from(b64, "base64").toString("utf-8"));
          ' "$CLEAN_PKG" "${{ github.event.inputs.appName }}" "${{ github.event.inputs.htmlContentBase64 }}"

          # 5. Add Android native platform
          npx cap add android

      - name: Compile APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
