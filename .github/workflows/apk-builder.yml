name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        required: false
        default: 'IndusApp'
      pkgName:
        description: 'Package Name'
        required: false
        default: 'com.indus.app'
      htmlContentBase64:
        description: 'Base64 Encoded HTML File'
        required: false
        default: 'PGgxPkluZHVzSHRtbCBBcHA8L2gxPg=='

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Native Android Project
        run: |
          # 1. Sanitize Package Name
          RAW_PKG="${{ github.event.inputs.pkgName }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._')
          if [[ "$CLEAN_PKG" != *.* ]] || [ -z "$CLEAN_PKG" ]; then
            CLEAN_PKG="com.indus.app"
          fi

          RAW_NAME="${{ github.event.inputs.appName }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="IndusApp"
          fi

          # 2. Setup Stable Capacitor 6
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0

          # 3. Create Web Directory
          mkdir -p www

          # 4. Safely write config & HTML with fallback protection
          node -e '
          const fs = require("fs");
          const appId = process.argv[1];
          const appName = process.argv[2];
          const b64 = process.argv[3] || "PGgxPkluZHVzSHRtbCBBcHA8L2gxPg==";
          
          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: appId,
            appName: appName,
            webDir: "www"
          }, null, 2));

          let html = "<h1>IndusHtml App</h1>";
          try {
            html = Buffer.from(b64, "base64").toString("utf-8");
          } catch(e) {}
          fs.writeFileSync("www/index.html", html);
          ' "$CLEAN_PKG" "$RAW_NAME" "${{ github.event.inputs.htmlContentBase64 }}"

          # 5. Add Android Platform
          npx cap add android

      - name: Compile APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName || 'IndusApp' }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
