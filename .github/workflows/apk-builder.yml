name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        required: false
        default: 'IndusApp'
      pkgName:
        description: 'Package Name'
        required: false
        default: 'com.indus.app'
      htmlContentBase64:
        description: 'Base64 Encoded HTML File'
        required: false
        default: 'PGgxPkluZHVzSHRtbCBBcHA8L2gxPg=='

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Native Android Project
        run: |
          RAW_PKG="${{ github.event.inputs.pkgName }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._')
          if [[ "$CLEAN_PKG" != *.* ]] || [ -z "$CLEAN_PKG" ]; then
            CLEAN_PKG="com.indus.app"
          fi

          RAW_NAME="${{ github.event.inputs.appName }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="IndusApp"
          fi

          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0

          mkdir -p www

          node -e '
          const fs = require("fs");
          const appId = process.argv[1];
          const appName = process.argv[2];
          const b64 = process.argv[3] || "PGgxPkluZHVzSHRtbCBBcHA8L2gxPg==";
          
          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: appId,
            appName: appName,
            webDir: "www"
          }, null, 2));

          let html = "<h1>IndusHtml App</h1>";
          try {
            html = Buffer.from(b64, "base64").toString("utf-8");
          } catch(e) {}
          fs.writeFileSync("www/index.html", html);
          ' "$CLEAN_PKG" "$RAW_NAME" "${{ github.event.inputs.htmlContentBase64 }}"

          npx cap add android

      - name: Compile APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Publish Dedicated App Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_NAME="${{ github.event.inputs.appName || 'IndusApp' }}"
          
          # Clean name for tag (lowercase, alphanumeric)
          SAFE_TAG_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-')
          if [ -z "$SAFE_TAG_NAME" ]; then
            SAFE_TAG_NAME="indusapp"
          fi

          # Clean filename for the APK
          APK_NAME=$(echo "$RAW_NAME" | tr -cd 'a-zA-Z0-9_-')
          if [ -z "$APK_NAME" ]; then
            APK_NAME="IndusApp"
          fi
          APK_FILENAME="${APK_NAME}.apk"

          # Copy and rename APK
          cp android/app/build/outputs/apk/debug/app-debug.apk "./$APK_FILENAME"

          # Unique Release Tag per App: release-appname-build#
          RELEASE_TAG="release-${SAFE_TAG_NAME}-${{ github.run_number }}"

          # Create custom public release
          gh release create "$RELEASE_TAG" "./$APK_FILENAME" \
            --title "🚀 $RAW_NAME (Build #${{ github.run_number }})" \
            --notes "### 📱 Download $RAW_NAME APK
          * **App Name:** $RAW_NAME
          * **Package ID:** ${{ github.event.inputs.pkgName || 'com.indus.app' }}
          * **Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          👇 **Tap the .apk file below to download and install immediately!**"
