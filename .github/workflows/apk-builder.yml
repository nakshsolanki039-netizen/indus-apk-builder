name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        required: true
        default: 'IndusApp'
      pkgName:
        description: 'Package Name'
        required: true
        default: 'com.indus.app'
      htmlContentBase64:
        description: 'Base64 Encoded HTML File'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Native Android Project & Inject HTML
        run: |
          # Sanitize Package Name
          RAW_PKG="${{ github.event.inputs.pkgName }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._')
          if [[ "$CLEAN_PKG" != *.* ]]; then
            CLEAN_PKG="com.indus.${CLEAN_PKG}"
          fi

          # Install Capacitor
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # Create web directory and decode HTML
          mkdir -p www
          echo "${{ github.event.inputs.htmlContentBase64 }}" | base64 --decode > www/index.html

          # Initialize Capacitor Android App
          npx cap init "${{ github.event.inputs.appName }}" "$CLEAN_PKG" --web-dir www
          npx cap add android

      - name: Compile APK via Android Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
